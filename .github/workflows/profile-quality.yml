name: Profile quality

on:
  pull_request:
    paths:
      - "README.md"
      - "brittek-keys-logo.webp"
      - "profile/**"
      - "scripts/validate_profile.py"
      - "lychee.toml"
      - ".github/workflows/profile-quality.yml"
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "brittek-keys-logo.webp"
      - "profile/**"
      - "scripts/validate_profile.py"
      - "lychee.toml"
      - ".github/workflows/profile-quality.yml"
  schedule:
    - cron: "13 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate profile
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate README structure and local assets
        run: python3 scripts/validate_profile.py

      - name: Check external links
        uses: lycheeverse/lychee-action@885c65f3dc543b57c898c8099f4e08c8afd178a2 # v2.6.1
        with:
          args: --no-progress --verbose README.md
          fail: true
          failIfEmpty: true
          jobSummary: true
          token: ${{ secrets.GITHUB_TOKEN }}
